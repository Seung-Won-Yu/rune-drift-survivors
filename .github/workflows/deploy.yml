name: Deploy web game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Install browser for smoke QA
        run: npx playwright install --with-deps chromium

      - name: Run survivor QA
        run: npm run qa:survivor
        env:
          CI: 'true'

      - name: Verify survivor Pages build
        run: npm run qa:survivor:production
        env:
          CI: 'true'
          GITHUB_PAGES: 'true'

      - name: Run smoke QA
        run: npm run qa:smoke
        env:
          CI: 'true'
          RUNE_QA_HEADLESS: '1'

      - name: Upload failed QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics
          path: |
            test-results/
            output/playwright/
          retention-days: 7
          if-no-files-found: ignore

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
