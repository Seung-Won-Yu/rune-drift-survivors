<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17271e"><meta name="description" content="잿빛의 숲 — 이동하고, 성장하고, 무리를 돌파하는 카툰 서바이버."><title>잿빛의 숲 · Ash & Amber</title></head>
<body>
  <canvas id="world" aria-label="잿빛의 숲 전투 화면"></canvas>
  <div id="hud" hidden>
    <header class="hud-top">
      <section class="health-pocket" aria-label="캐릭터 상태"><div class="health-meta"><span class="hero-mark">A</span><div><small id="hero-name">잿빛 검사</small><strong id="hp-text">100 / 100</strong></div><span id="level-badge">LV 1</span></div><div id="hp-bar" class="meter health" role="progressbar" aria-label="체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i></div></section>
      <section class="clock-pocket"><small id="phase-label">숲의 가장자리</small><strong id="clock">5:00</strong><span><b id="kills">0</b> 처치</span></section>
      <div class="hud-actions"><button id="sound" class="icon-button" aria-label="소리 켜기" aria-pressed="false"></button><button id="pause" class="icon-button" aria-label="일시정지"></button></div>
      <div class="xp-pocket"><span id="xp-label">다음 성장</span><div id="xp-bar" class="meter xp" role="progressbar" aria-label="경험치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><small id="xp-text">0 / 8</small></div>
    </header>
    <section id="boss-hud" class="boss-hud" aria-label="최후의 대결" hidden><div class="boss-heading"><span>FINAL ENCOUNTER</span><strong id="boss-name">재의 군주</strong></div><div id="boss-health" class="meter boss-health" role="progressbar" aria-label="재의 군주 체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i></div><p id="boss-caption"></p></section>
    <div id="recovery-hint" class="recovery-hint" hidden></div>
    <div id="evolution-hint" class="evolution-hint"></div>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <footer class="hud-bottom"><div id="weapons" class="weapon-belt" aria-label="장착 무기"></div><p id="coach">공격은 자동 · 파란 경험치를 모으세요</p><span class="chapter">ASH & AMBER <i>01</i></span></footer>
    <div id="touch" class="touch-pad" role="group" aria-label="이동 조이스틱"><span>MOVE</span><i></i></div>
  </div>
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="panel-title"><section id="panel" class="panel"><p class="eyebrow">ASH & AMBER</p><h1 id="panel-title">숲을 깨우는 중</h1><p class="panel-lead">캐릭터와 전장을 준비하고 있습니다.</p></section></div>
  <script type="module" src="../src/survivor/main.js"></script>
</body>
</html>
